[package]
name = "relic-crypto"
version = "0.1.0"
description = "Canonical hashing and system-signature primitives for RELIC"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption"] }
thiserror = "2.0"
zeroize = "1.8"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3.23"

[lints]
workspace = true
