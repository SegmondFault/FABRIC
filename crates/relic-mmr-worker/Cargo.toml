[package]
name = "relic-mmr-worker"
version = "0.1.0"
description = "Merkle Mountain Range checkpoint worker for RELIC"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "relic-checkpoint-mmr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
relic-crypto = { path = "../relic-crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = "1.8"

[lints]
workspace = true
