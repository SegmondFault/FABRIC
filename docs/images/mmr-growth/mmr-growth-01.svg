<text x="95" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#566175">leaf 0</text>
<text x="95" y="387" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#7c3aed">PEAK</text>
<rect x="1180" y="368" width="225" height="102" rx="16" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
<text x="1202" y="398" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#566175">CURRENT PEAKS</text>
<text x="1202" y="430" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#7c3aed">[0]</text>
<text x="1202" y="455" font-family="system-ui, sans-serif" font-size="13" fill="#566175">left-to-right order</text>
