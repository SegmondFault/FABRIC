<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="520" viewBox="0 0 1450 520" role="img" aria-labelledby="title desc">
<title id="title">MMR after 1 leaf</title>
<desc id="desc">Merkle Mountain Range containing leaf indexes zero through 0. Current peaks are highlighted.</desc>
<rect width="1450" height="520" rx="22" fill="#f8fafc"/>
<text x="44" y="50" font-family="system-ui, sans-serif" font-size="29" font-weight="700" fill="#172033">Step 1: 1 leaf</text>
<text x="44" y="82" font-family="system-ui, sans-serif" font-size="17" fill="#566175">Append leaf index 0 · indexes are permanent.</text>
<rect x="490" y="25" width="470" height="72" rx="18" fill="#172033"/>
<text x="725" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">CHECKPOINT COMMITMENT</text>
<text x="725" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">ordered bag of the current peaks</text>
<path d="M 95 403 C 95 364, 725 135, 725 98" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.75"/>
